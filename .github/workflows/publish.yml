name: Publish to PyPI

on:
  push:
    tags:
      - "hotspot-research-cli/v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
        working-directory: packages/hotspot-cli
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/hotspot-cli/dist
